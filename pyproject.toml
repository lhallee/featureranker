[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "featureranker"
version = "2.0.0"
description = "Feature ranking ensemble using L1 penalization, random forests, XGBoost, ANOVA F-scores, and mutual information"
readme = "README.md"
license = "CC-BY-NC-SA-4.0"
requires-python = ">=3.9"
authors = [
    { name = "Logan Hallee", email = "lhallee99@gmail.com" },
]
keywords = ["feature-ranking", "feature-selection", "sklearn", "ensemble", "machine-learning"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
dependencies = [
    "pandas>=2.0.0",
    "numpy>=1.24.0",
    "scikit-learn>=1.3.0",
    "matplotlib>=3.7.0",
    "seaborn>=0.12.0",
    "scipy>=1.10.0",
    "xgboost>=1.7.0",
    "joblib>=1.2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov",
]

[project.urls]
Repository = "https://github.com/lhallee/feature-ranker"

[tool.hatch.build.targets.wheel]
packages = ["src/featureranker"]
